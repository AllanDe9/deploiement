name: ci-exo2

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/index.js

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Write summary
        if: always()
        run: |
          echo "## Build result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node version: $(node -v)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files in dist/: $(find dist -type f 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size of dist/: $(du -sh dist 2>/dev/null | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
